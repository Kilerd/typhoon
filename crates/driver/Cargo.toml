[package]
name = "typhoon-driver"
version.workspace = true
edition.workspace = true

[dependencies]
typhoon-codegen = { path = "../codegen" }
typhoon-codegen-wasm = { path = "../codegen-wasm" }

[dev-dependencies]
libtest-mimic = "0.8"
# The golden suite runs every program on the wasm backend as well, under a real
# engine, and compares its output with the native one byte for byte.
wasmtime = "48"

[[test]]
name = "golden"
path = "tests/golden.rs"
harness = false
