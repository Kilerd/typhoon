name: Pages

# Builds the WebAssembly playground (crates/playground + web/) and publishes
# web/ to GitHub Pages at https://kilerd.github.io/typhoon/.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel, so master always ends up
# published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No clang and no Boehm GC here: the playground is the frontend only, it
      # stops at textual LLVM IR and never links anything.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: pages

      # The wasm-bindgen CLI has to be the exact version of the wasm-bindgen
      # crate in the lockfile, which is also what web/build.sh checks.
      - name: Resolve the wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          version="$(
            awk '/^name = "wasm-bindgen"$/ { found = 1; next }
                 found && /^version = / { gsub(/[",]/, "", $3); print $3; exit }' Cargo.lock
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $version"

      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen-version.outputs.version }} --locked

      - name: Build the playground
        # `bash …` rather than `./…` so the build does not depend on the exec
        # bit surviving the checkout.
        run: bash web/build.sh

      - uses: actions/configure-pages@v5

        with:

          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
