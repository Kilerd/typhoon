name: PR

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The compiler shells out to clang to optimise and link the LLVM IR it
      # emits (DESIGN 6.2), and links Boehm GC into every binary (DESIGN 5.1).
      - name: Install clang and Boehm GC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang llvm libgc-dev

      - name: Install clang and Boehm GC (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bdw-gc llvm
          echo "TYPHOON_CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Includes the golden test harness over tests/run, tests/fail and
      # examples/ (DESIGN 7.1).
      - name: Test
        run: cargo test --workspace
